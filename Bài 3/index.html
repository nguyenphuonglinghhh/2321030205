<html>
    <head>
        <title>Bài 3</title>
    </head>
    <body>
        <MARQUEE>
            <img src="/ảnh/tải xuống.jpg">
        </MARQUEE>
        <!-- ol Danh sách có thứ tự -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>
        <!-- ul Danh sách không có thứ tự -->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>


        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên</b><br>
                <!-- nếu input không có type thì sẽ -->
                <!-- mặc định là text -->
                <!-- thuộc tính readonly sử dụng khi -->
                <!-- không muốn người dùng nhập -->
                <!-- thông tin vào input -->
                <input type="text" placeholder="Họ và tên">
            </div>
            <div>
                <b>Năm sinh</b><br>
                <input type="number" placeholder="Năm sinh">
            </div>
            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu">
            </div>
            <div>
                <b>Giới thiệu về bản thân</b><br>
                <textarea>Nhập thông tin...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type="email">
            </div>
            <div>
                <!-- số đầu tiên: 0 -->
                <!-- số thứ 2: 3, 9, 8 -->
                <!-- 8 số cuối: 0-9 -->
                <b>Số diện thoại</b><br>
                <input type="tel"
                pattern="([0] {1} ([3,8,9]] {1}) ([0-9]{8}))">
            
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam"> Nam <br>
                <input type="radio" name="gioitinh" value="nu"> Nữ <br>
            </div>
            <div>
                <b>Sở thích</b><br>
                Chơi game: <input type="checkbox" name="sothich" value="choigame"><br>
                Nghe nhạc: <input type="checkbox" name="sothich" value="nghenhac"><br>
                Thể thao: <input type="checkbox" name="sothich" value="thethao"><br>
            </div>
            <div>
                <b>Trình duyệt web yêu thích</b><br>
                <select name="browsers">
                    <option value="Internet Explorer">Internet Explorer</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Chorme">Chorme</option>
                    <option value="Opera">Opera</option>
                    <option value="Safari">Safari</option>
                    <option value="Cốc cốc">Cốc cốc</option>
                </select>
            </div>
            <div>
                <!-- 0 <input type="range" id="a" value="50"> 100 -->
            </div>
        
            <div>
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>
        </form>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/pzL_FW80zoY?si=D47pSX0tlnkVToab" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <video control width="560" height="315">
            <source src="/ảnh/tinh cờ yêu em_files/" type="video/files">
        </video>
    </body>
</html>
