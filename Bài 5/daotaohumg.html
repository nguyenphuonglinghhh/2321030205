<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo HUMG</title>
    <style>
        body{
            margin: 0px;
        }
        ul{
            margin: 0px;
        }
        .menu{
            background-color: #2fa4e7;
            margin: 0px;

        }
        .danh-sach-muc{
            /* bỏ dấu chấm của list */
            list-style: none;
            margin: 0px;
            display: flex
        }
        .muc{
            
            /* background-color: red; */
            padding: 15px;
            /* font-weight: bold; */
        }
        a{
            color: white;
            /* để bỏ gạch chân của thẻ a */
            text-decoration: none;
        }
        main{
            display: flex;
        }
        .khoi-trai{
            
            width: 20%;
            height: 500px;
        }
        .khoi-phai{
            background-color: green;
            width: 80%;
            height: 500px;
        }
    </style>
</head>
<body>
    <!-- Thanh menu -->
        <nav class="menu">
            <ul class="danh-sach-muc">
                <li class="muc"><a href="#">Thực tập, Đồ án</a></li>
                <li class="muc"><a href="#">Thủ tục Một cửa</a></li>
                <li class="muc"><a href="#">Một cửa online</a></li>
                <li class="muc"><a href="#">E-mail HUMG</a></li>
            </ul>
        </nav>
        <!-- Nội dung chính -->
        <main>
            <div class="khoi-trai">
                <div class="dang-nhap">
                    <form action="">
                        <p>Tài khoản</p>
                        <input type="text">
                        <p>Mật khẩu</p>
                        <input type="password">
                        <div style="width: 100%;">
                        <button>Đăng nhập</button>
                        </div>
                        <div style="width: 100%;">
                        <button>Mật khẩu</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="khoi-phai">Phải </div>
        </main>
</body>
</html>
