<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTV Go</title>
    <style>
body{
    background-color: #1C1B20;
    color: white;
}
header{
    display:flex;
    justify-content: space-between;
    padding: 0 10px;
    border-bottom: 1px solid #333333;
    margin: 0 40px;
}

.danh-sach-danh-muc {
    list-style: none;
    display: flex;
    gap: 40px;
}
.danh-sach-danh-muc a{
    color: white;
    text-decoration: none;
}
.muc:hover{
    border-bottom: 1px solid red;
}
.logo{
    width: 8%;
}
.banner{
    width: 60%;
    margin: 20px auto;

}
.banner-img{
    width: 100%;
    height: 70vh;
    border-radius: 20px;
    
}
footer{
    padding: 0 30px;
}
.danh-sach-kenh{
    display:flex;
    justify-content: space-between;
}
.kenh-truyen-hinh{
    width: 100%;
    height: 20vh;
    
}
.kenh{
    width: 10%;
    height: 15vh;
    

     img{
        width: 92%;
        height: 10vh;
        border-radius: 20px;
    }
}


    </style>
</head>
<body>
    <header>
        <nav class="danh-muc">
            <ul class="danh-sach-danh-muc">
                <img class="logo" src="../ảnh/logoVTV.png" alt="">
                <li class="muc"><a class="lien-ket-muc" href="#">Loyalty</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Truyền hình</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Cổng nội dung</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Xem thêm</a></li>
            </ul>
        </nav>
        <div>
            <img style="display:flex; justify-content: flex-end;" src="../ảnh/muagoiVTV.png" alt="">
        </div>
    </header>
    <main>
        <div class="banner">
            <img class="banner-img" src="../ảnh/banner.webp" alt="">
        </div>
    </main>
    <footer>
        <div class="kenh-truyen-hinh">
            <div class=chan-trang>
                <h3>Kênh truyền hình</h3>

            </div>
            <div class="danh-sach-kenh">
                <div class="kenh">
                     <img src="../ảnh/vtv1.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv2.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv3.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv4.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vn today.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv5.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv5-1.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv52.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv6.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv7.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv8.webp" alt="">
                </div>
                <div class="kenh">
                     <img src="../ảnh/vtv9.webp" alt="">
                </div>
            </div>

    </footer>
    
</body>
</html>
