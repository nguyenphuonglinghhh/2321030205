<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - JS</title>
    <style>
        main{
            display:flex;
        }
        .trai{
            width: 75%;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .phai{
            width: 25%;
            border: 1px solid gray;
            border-radius: 20px;
            text-align: center;
        }
        .video{
            width: 90%;
            height: 550px;
            background-color: black;
            border-radius: 20px;
        }
        .bai-hat:hover{
            background-color: gray;
        }
        .bai-hat{
            width: 95%;
            height: 80px;
            background-color: antiquewhite;
            display:flex;
            align-items: center;
            margin: 10px auto;
        }
        img{
            width: 40%;
            margin-right: 10px;
            margin:auto;
        }
        p{
            width: 75%;
            
        }
    </style>
</head>
<body>
    <main>
        <div class="trai">
            <!-- <div class="video">

            </div> -->
            <iframe class="video" src="https://www.youtube.com/embed/9UcQ7ddVjoc?si=Q7IhaZ3Xuq5YkSq6" ></iframe>"
        </div>
        <div class="phai">
            <h1>Danh sách</h1>
            <div class="danh-sach">
                <div onclick="chonBai(1)" class="bai-hat">
                    <img class="anh-bai" src="quanA.P.avif" alt="">
                    <p>CÓ AI HẸN HÒ CÙNG EM CHƯA | QUÂN A.P | OFFICIAL MV</p>

                </div>
                <div onclick="chonBai(2)" class="bai-hat">
                    <img class="anh-bai" src="buitruonglinh.avif" alt="">
                    <p>TỪNG NGÀY YÊU EM / buitruonglinh</p>

                </div>
                <div onclick="chonBai(3)" class="bai-hat">
                    <img class="anh-bai" src="hngle.avif" alt="">
                    <p>Hngle - Tìm em ft. Bảo Anh | Official Music Video</p>

                </div>
                <div onclick="chonBai(4)" class="bai-hat">
                    <img class="anh-bai" src="lanman.avif" alt="">
                    <p>Lan Man | Ronboogz (Lyrics Video)</p>
                </div>
                <div onclick="chonBai(5)" class="bai-hat">
                    <img class="anh-bai" src="jukysan.avif" alt="">
                    <p>Người Đầu Tiên - Juky San feat. buitruonglinh</p>
                </div>

            </div>

        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
