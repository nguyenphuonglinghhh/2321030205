<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <link rel="stylesheet" href="style.css">

    <style>
        h2{
            color: white;
            background-color: black;
        }

        #tieude-1{
            color: red;
            background-color: black;
        }
    </style>
</head>
<body>
  

    <h1 style="color: pink; background-color: blue;">Web 1</h1>
    <!-- Nếu là id sử dụng # + tên id -->
    <!-- Ví dụ ở dưới #tieude-1 -->
    <h2 id="tieude-1">Web 2</h2>
    <!-- Nếu là class sử dụng . + tên id -->
    <!-- Ví dụ ở dưới .tieude-2 -->
    <h3 class="tieude-2">Web 3</h3>

    <div>Web 4</div>
    <div class="web4">Web 4</div>

</body>
</html>
